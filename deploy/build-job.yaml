# One-off image build on the homelab node: kaniko reads the checkout at
# /srv/notexoweb (hostPath, read-only) and pushes to Harbor's internal
# registry with a copy of the Tekton push credentials (Secret harbor-push).
# Runs in the notexoweb namespace: tekton-pipelines enforces PodSecurity
# "baseline", which forbids the hostPath source mount.
#
#   TAG=$(git -C /srv/notexoweb rev-parse --short HEAD)
#   sed "s/__TAG__/$TAG/" deploy/build-job.yaml | kubectl create -f -
#   kubectl -n notexoweb logs -f job/notexoweb-build-$TAG
#
# Build the committed state: the Job sees the working tree as it is on disk.
apiVersion: batch/v1
kind: Job
metadata:
  name: notexoweb-build-__TAG__
  namespace: notexoweb
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: rtm
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:latest
          args:
            - --dockerfile=Dockerfile
            - --context=dir:///workspace
            - --destination=harbor-core.harbor/homelab/notexoweb:__TAG__
            - --destination=harbor-core.harbor/homelab/notexoweb:latest
            - --insecure
            - --skip-tls-verify
            - --snapshot-mode=redo
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "2", memory: 4Gi }
          volumeMounts:
            - name: source
              mountPath: /workspace
              readOnly: true
            - name: docker-config
              mountPath: /kaniko/.docker
      volumes:
        - name: source
          hostPath:
            path: /srv/notexoweb
            type: Directory
        - name: docker-config
          secret:
            secretName: harbor-push
            items:
              - key: .dockerconfigjson
                path: config.json
