<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player</title>
<link rel="stylesheet" href="/vendor/js-dos/dist/js-dos.css">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  #dos { position: absolute; inset: 0; }
  #status { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; color: #aaa; pointer-events: none; }
  #status.error { color: #f19b8c; pointer-events: auto; }
  #status .t { font-size: 16px; color: #eee; margin-bottom: 6px; }
  /* Toolbar (top right): scanlines, keyboard lock, fullscreen, close. Fades
     back while playing so it doesn't sit on the game. */
  #toolbar { position: absolute; top: 10px; right: 12px; z-index: 10; display: flex; gap: 6px;
             opacity: 0.45; transition: opacity 0.2s ease; }
  #toolbar:hover, #toolbar:focus-within, body.show-toolbar #toolbar { opacity: 1; }
  #toolbar button { border: 0; border-radius: 6px; padding: 6px 11px; background: rgba(30, 30, 34, 0.88);
                    color: #eee; font: inherit; cursor: pointer; }
  #toolbar button:hover { background: rgba(60, 60, 68, 0.95); }
  #toolbar button[aria-pressed="true"] { background: rgba(84, 70, 170, 0.92); color: #fff; }
  #toolbar button[hidden] { display: none; }
  /* Phones: icons only, bigger touch targets. */
  @media (max-width: 600px) { #toolbar .l { display: none; } #toolbar button { padding: 8px 12px; font-size: 16px; } }
  /* CRT scanlines: JS places this exactly over the game's canvas and sets --p
     (one emulated line, in px) so each dark line sits on a pixel-row boundary. */
  #scanlines { position: absolute; z-index: 5; pointer-events: none; display: none; --p: 3px;
    background:
      repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--p) * 0.55), rgba(0, 0, 0, 0.38) calc(var(--p) * 0.55), rgba(0, 0, 0, 0.38) var(--p)),
      radial-gradient(ellipse at center, transparent 62%, rgba(0, 0, 0, 0.4) 100%);
    mix-blend-mode: multiply; }
  body.scanlines #scanlines { display: block; }
  #status.ask { pointer-events: auto; }
  .ask-buttons { margin-top: 14px; display: flex; gap: 8px; justify-content: center; }
  .ask-buttons button { border: 0; border-radius: 6px; padding: 8px 16px; font: inherit; cursor: pointer; background: #333; color: #eee; }
  .ask-buttons button.primary { background: #3f6fd8; color: #fff; }
  progress { width: min(420px, 80vw); height: 10px; margin-top: 12px; accent-color: #3f6fd8; }
  #status a { color: #8fb0ff; }
  /* Shown while the browser keeps the game's audio blocked (no click/key yet). */
  #sound-hint { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 10; display: none;
                padding: 6px 14px; border-radius: 999px; background: rgba(30, 30, 34, 0.9); color: #eee; pointer-events: none; }
  body.audio-blocked #sound-hint { display: block; }
</style>
</head>
<body>
<div id="dos"></div>
<div id="status"><div><div class="t" id="title">Loading…</div><div id="detail"></div></div></div>
<div id="scanlines"></div>
<div id="toolbar">
  <button id="scan" type="button" aria-pressed="false" title="CRT scanlines on/off">▤<span class="l"> Scanlines</span></button>
  <button id="lock" type="button" aria-pressed="false" title="In fullscreen, send all keys (Esc, Ctrl+W, …) to the game. Hold Esc to leave fullscreen." hidden>⌨<span class="l"> Lock keys</span></button>
  <button id="full" type="button" title="Fullscreen (F11-free)">⛶<span class="l"> Fullscreen</span></button>
  <button id="close" type="button" title="Close (returns to the library)">✕<span class="l"> Close</span></button>
</div>
<div id="sound-hint">🔇 Click or press a key for sound</div>
<script>
  // Browsers start a page's audio "suspended" until the user clicks, taps or
  // types on it. js-dos resumes only on the first pointerdown/keydown, once;
  // if that event didn't count as a user gesture (Escape, Safari's
  // pointerdown, ...) the game stayed silent for the whole session. Track every
  // AudioContext and retry on each gesture until it runs.
  (() => {
    const Orig = window.AudioContext;
    if (!Orig) return;
    const contexts = new Set();
    const update = () => {
      for (const c of contexts) if (c.state === "closed") contexts.delete(c);
      document.body?.classList.toggle("audio-blocked", [...contexts].some((c) => c.state === "suspended"));
    };
    window.AudioContext = class extends Orig {
      constructor(...args) {
        super(...args);
        contexts.add(this);
        this.addEventListener("statechange", update);
        setTimeout(update, 1500);
      }
    };
    const resume = () => { for (const c of contexts) if (c.state === "suspended") c.resume().then(update, () => {}); };
    for (const type of ["pointerdown", "pointerup", "click", "touchend", "keydown", "keyup"]) addEventListener(type, resume, { capture: true });
  })();
</script>
<script src="/vendor/js-dos/dist/js-dos.js"></script>
<script type="module">
  import { cached, download, fmtBytes } from "/downloads.js";
  const id =Number(new URLSearchParams(location.search).get("id"));
  const statusEl = document.getElementById("status");
  const say = (title, detail = "") => {
    document.getElementById("title").textContent = title;
    document.getElementById("detail").textContent = detail;
  };
  const done = () => parent.postMessage({ type: "exodiumweb:player-closed", id }, location.origin);
  let dosProps = null;
  let closing = false;
  const close = async () => {
    if (closing) return;
    closing = true;
    statusEl.style.display = "";
    say("Saving…");
    // Saves go to the server (per user) through fsChanges.push below.
    try { if (window.__player.ready) await dosProps?.save?.(); } catch (e) { console.error("save failed", e); }
    try { await dosProps?.stop?.(); } catch {}
    done();
  };
  document.getElementById("close").onclick = close;
  // The library asks us to close when the browser's Back button is pressed,
  // and reports fullscreen changes (it owns fullscreen + keyboard lock).
  addEventListener("message", (e) => {
    if (e.origin !== location.origin) return;
    if (e.data?.type === "exodiumweb:close") close();
    if (e.data?.type === "exodiumweb:fullscreen-state") {
      fullBtn.setAttribute("aria-pressed", String(e.data.fullscreen));
      fullBtn.querySelector(".l").textContent = e.data.fullscreen ? " Exit fullscreen" : " Fullscreen";
    }
  });

  // Scanlines and keyboard lock are remembered per browser.
  const pref = (k, v) => (v === undefined ? localStorage.getItem(`exodiumweb:${k}`) === "on" : localStorage.setItem(`exodiumweb:${k}`, v ? "on" : "off"));
  const scanBtn = document.getElementById("scan");
  const lockBtn = document.getElementById("lock");
  const fullBtn = document.getElementById("full");
  const setScan = (on) => { document.body.classList.toggle("scanlines", on); scanBtn.setAttribute("aria-pressed", String(on)); pref("scanlines", on); };
  const setLock = (on) => { lockBtn.setAttribute("aria-pressed", String(on)); pref("lockKeys", on); };
  setScan(pref("scanlines"));
  setLock(pref("lockKeys"));
  scanBtn.onclick = () => setScan(!document.body.classList.contains("scanlines"));
  // Align the overlay to the canvas: one gradient period per emulated line
  // (canvas.height), shown as a whole number of device pixels so lines don't shimmer.
  const scanEl = document.getElementById("scanlines");
  const alignScan = () => {
    const cv = [...document.querySelectorAll("#dos canvas")].sort((a, b) => b.clientWidth * b.clientHeight - a.clientWidth * a.clientHeight)[0];
    if (!cv || !cv.height || !cv.clientHeight) return;
    const r = cv.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    let period = r.height / cv.height;
    if (period * dpr >= 2) period = Math.round(period * dpr) / dpr;
    Object.assign(scanEl.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px" });
    scanEl.style.setProperty("--p", period + "px");
  };
  setInterval(() => document.body.classList.contains("scanlines") && alignScan(), 250);
  addEventListener("resize", alignScan);
  scanBtn.addEventListener("click", alignScan);
  // Keyboard lock is a Chromium feature; only offer it where it exists.
  if (typeof navigator.keyboard?.lock === "function") lockBtn.hidden = false;
  lockBtn.onclick = () => setLock(lockBtn.getAttribute("aria-pressed") !== "true");
  fullBtn.onclick = () => parent.postMessage({ type: "exodiumweb:fullscreen", lockKeys: pref("lockKeys") }, location.origin);
  // Keep the toolbar readable for a few seconds after the mouse moves.
  let toolbarTimer;
  addEventListener("pointermove", () => {
    document.body.classList.add("show-toolbar");
    clearTimeout(toolbarTimer);
    toolbarTimer = setTimeout(() => document.body.classList.remove("show-toolbar"), 2500);
  });

  // js-dos keeps a game's changed files as one "changes" blob; it lives on the
  // server per user, so progress follows the user to any browser.
  const saveUrl = `/api/saves/${id}`;
  const fsChanges = {
    pull: async () => {
      const r = await fetch(saveUrl, { cache: "no-store" });
      if (r.status === 204 || !r.ok) return null;
      window.__player.restored = true;
      return new Uint8Array(await r.arrayBuffer());
    },
    push: async (_key, data) => {
      const r = await fetch(saveUrl, { method: "PUT", headers: { "Content-Type": "application/octet-stream" }, body: data });
      if (!r.ok) throw new Error(`save failed (${r.status})`);
      window.__player.saved = (window.__player.saved ?? 0) + 1;
    },
    delete: async () => { await fetch(saveUrl, { method: "DELETE" }); },
  };
  window.__player = { ready: false, error: null, events: [] };
  const CANCELLED = Symbol("cancelled");

  /** Object URL for a large game's bundle: from browser storage, or downloaded after asking. Null = cancelled. */
  async function largeBundle(info) {
    const key = new URL(info.bundleUrl, location.href).href;
    const hit = await cached(key);
    if (hit) {
      window.__player.fromStorage = true;
      say(info.game.title, "Starting from this device's storage…");
      return URL.createObjectURL(await hit.blob());
    }
    const autodownload = new URLSearchParams(location.search).get("autodownload") === "1"; // tests
    if (!autodownload && !(await ask(info))) return null;
    statusEl.classList.remove("ask");
    const bar = document.createElement("progress");
    say(info.game.title, `Downloading ${fmtBytes(info.bundleBytes)}…`);
    document.getElementById("detail").after(bar);
    const blob = await download(key, { id: info.game.id, title: info.game.title, bytes: info.bundleBytes }, (got, total) => {
      bar.max = total; bar.value = got;
      document.getElementById("detail").textContent = `Downloading ${fmtBytes(got)} of ${fmtBytes(total)}`;
    });
    bar.remove();
    window.__player.downloaded = true;
    window.__player.stored = blob.stored;
    if (!blob.stored) say(info.game.title, "Starting… (couldn't keep it on this device, so it will download again next time)");
    return URL.createObjectURL(blob);
  }

  function ask(info) {
    statusEl.classList.add("ask");
    say(info.game.title, "");
    const detail = document.getElementById("detail");
    detail.innerHTML = "";
    detail.append(
      `This game is ${fmtBytes(info.bundleBytes)}. It is downloaded once and kept on this device, so it starts straight away next time.`,
      document.createElement("br"),
    );
    const manage = Object.assign(document.createElement("a"), { href: "/downloads.html", target: "_blank", textContent: "Manage downloaded games" });
    const buttons = Object.assign(document.createElement("div"), { className: "ask-buttons" });
    const go = Object.assign(document.createElement("button"), { className: "primary", textContent: `Download ${fmtBytes(info.bundleBytes)}` });
    const no = Object.assign(document.createElement("button"), { textContent: "Cancel" });
    buttons.append(go, no);
    detail.append(manage, buttons);
    return new Promise((resolve) => { go.onclick = () => resolve(true); no.onclick = () => resolve(false); });
  }

  try {
    // Testing overrides pass through to the launch API (backend, cmd).
    const pass = new URLSearchParams();
    for (const k of ["backend", "cmd"]) { const v = new URLSearchParams(location.search).get(k); if (v) pass.set(k, v); }
    const res = await fetch(`/api/play/${id}${pass.size ? `?${pass}` : ""}`);
    const info = await res.json();
    if (!res.ok) throw new Error(info.error ?? `HTTP ${res.status}`);
    document.title = info.game.title;
    say(info.game.title, "Loading…");

    // Large games (CD images etc.) are downloaded once, after asking, and then
    // start from this browser's storage. Small ones load straight from the server.
    const bundleUrl = info.large ? await largeBundle(info) : info.bundleUrl;
    if (!bundleUrl) throw CANCELLED;

    const voodoo = info.info.voodoo && info.backend === "dosboxX";
    dosProps = Dos(document.getElementById("dos"), {
      pathPrefix: "/vendor/js-dos/dist/emulators/",
      backend: info.backend,
      backendLocked: true,
      url: bundleUrl,
      fsChanges,
      autoSave: true,
      autoStart: true,
      noCloud: true,
      thinSidebar: true,
      theme: "dark",
      ...(voodoo ? { renderBackend: "webgl", offscreenCanvas: true, workerThread: true } : {}),
      onEvent: (event, ci) => {
        window.__player.events.push(event);
        if (event === "ci-ready") {
          window.__player.ready = true;
          window.__player.ci = ci;
          statusEl.style.display = "none"; // the `hidden` attribute loses to #status's display:grid
        }
        if (event === "exit") done();
      },
    });
  } catch (e) {
    if (e === CANCELLED) {
      done();
    } else {
      window.__player.error = String(e?.message ?? e);
      statusEl.classList.remove("ask");
      statusEl.classList.add("error");
      say("Couldn't start this game", window.__player.error);
    }
  }
</script>
</body>
</html>
