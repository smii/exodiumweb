<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>notexoweb PoC</title>
<style>
  :root { color-scheme: dark; --bg: #121214; --fg: #e8e6e3; --muted: #9a9890; --line: #2a2a2e; --accent: #d4a24c; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 20px; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  a { color: var(--accent); text-decoration: none; }
  .tag { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>notexoweb — proof of concept</h1>
  <p>eXoDOS games from the NAS, booted in the browser by js-dos 8. One game per feature.</p>
  <table>
    <thead><tr><th>Game</th><th>Tests</th><th>Play</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<script type="module">
  const games = await (await fetch("/api/games")).json();
  const rows = document.getElementById("rows");
  for (const g of games) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${g.title} <span class="tag">(${g.year ?? "?"})</span></td>
      <td class="tag">${g.feature}</td>
      <td><a href="/play.html?g=${encodeURIComponent(g.short)}">auto</a> ·
          <a href="/play.html?g=${encodeURIComponent(g.short)}&backend=dosbox">dosbox</a> ·
          <a href="/play.html?g=${encodeURIComponent(g.short)}&backend=dosboxX">dosbox-x</a></td>`;
    rows.append(tr);
  }
</script>
</body>
</html>
